sources:
  vector_metrics:
    type: "internal_metrics"
    scrape_interval_secs: 10
  # metrics_input:
  #   type: "prometheus_scrape"
  #   endpoints: [ "http://envoy:19010/stats/prometheus?filter=downstream_rq_total" ]
  #   scrape_interval_secs: 3
  #   scrape_timeout_secs: 5
  statsd:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:8125
    http:
      address: 0.0.0.0:8126
      headers: []
      keepalive:
        max_connection_age_jitter_factor: 0.1
        max_connection_age_secs: 300
transforms:
  enforcer_filter:
    type: filter
    inputs: [statsd.metrics]
    condition: contains(string!(.name),"downstream_rq_total") == true
      # type: vrl
      # source: match!(.name, r'.*.downstream_rq_total')
  enforcer_metrics_to_logs:
    type: metric_to_log
    inputs: [enforcer_filter]
  license_metering:
    type: remap
    drop_on_abort: true
    inputs: [enforcer_metrics_to_logs]
    source: |-
      # only keep downstream_rq_total metrics
      if !contains(string!(.name), "downstream_rq_total") {
        abort;
      }
      # set logtype
      .logtype = "Metric";
      .metric = del(.name);
      .value = .counter.value;
      del(.counter)
      .fluentbit_ts = del(.timestamp);
      del(.kind)
      del(.tags)
sinks:
  # out:
  #   type: "blackhole"
  #   inputs: ["license_metering"]
  print:
    type: "console"
    inputs: ["license_metering"]
    encoding:
      codec: "json"
      json:
        pretty: true
  promethues_metrics:
    type: "prometheus_exporter"
    inputs: ["vector_metrics"]
    address: "0.0.0.0:2025"
    flush_period_secs: 60
api:
  enabled: true
  address: "127.0.0.1:8686"
  playground: true
# Set global options
data_dir: "/var/lib/vector"